<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Obstáculos — Juego</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#101522}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-weight:800;text-shadow:0 2px 4px #000}
.badge{background:#0008;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;backdrop-filter:blur(5px)}
#msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);text-align:center;background:#000b;border:1px solid #fff2;border-radius:18px;padding:14px 18px;max-width:90%;display:none}
#msg b{font-size:1.2rem}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));height:100px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}
.pad{display:flex;gap:12px}
button{width:76px;height:76px;border:0;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35;color:white;font-size:30px;font-weight:900;box-shadow:0 5px 18px #0007}
button:active{background:#ffffff38;transform:scale(.96)}
#jump{background:#276cff55}
#weapon{display:none;background:#e09b3d66;border-color:#ffd77a88;font-size:28px}
#weapon.active{display:block}
#turbo{display:none;background:#31c8ff66;border-color:#8be8ff99;font-size:25px}
#turbo.active{display:block}
#shopBtn{position:fixed;left:12px;top:72px;z-index:10000;width:auto;height:auto;padding:10px 14px;border-radius:12px;background:#5d3f1fdd;border-color:#ffd45a66;font-size:14px;box-shadow:0 5px 16px #0007;pointer-events:auto}
#shop{position:fixed;inset:0;z-index:10001;display:none;align-items:center;justify-content:center;background:#050914cc;pointer-events:auto}
#shop.open{display:flex}
.shopCard{width:min(92vw,520px);max-height:82vh;overflow:auto;background:#111a2b;border:1px solid #ffffff22;border-radius:20px;padding:18px;box-shadow:0 20px 60px #000b}
.shopHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.shopHead h2{margin:0}.shopClose{width:42px;height:42px;font-size:20px}.skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.skin{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:16px;padding:12px}.skinPreview{height:100px;border-radius:12px;background:linear-gradient(135deg,#1c2944,#0d1322);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.miniAvatar{position:relative;width:40px;height:70px}.miniAvatar .head{position:absolute;left:10px;top:0;width:20px;height:20px;border-radius:50%;background:#f2c7a5}.miniAvatar .body{position:absolute;left:7px;top:19px;width:26px;height:30px;border-radius:7px;background:var(--skin)}.miniAvatar .legs{position:absolute;left:9px;top:47px;width:22px;height:20px;background:linear-gradient(90deg,#202941 45%,transparent 45%,transparent 55%,#202941 55%)}.skin b{display:block}.skin small{display:block;opacity:.75;margin:3px 0 9px}.skin button{width:100%;height:42px;border-radius:10px;font-size:14px;background:#ffffff14}.skin button:disabled{opacity:.45}.shopNote{font-size:12px;opacity:.7;margin-top:12px}
#restartControls{position:fixed;right:12px;top:72px;z-index:9999;display:flex;flex-direction:column;gap:8px;font-family:system-ui,sans-serif;pointer-events:auto}
#restartControls button{width:auto;height:auto;padding:10px 12px;border-radius:10px;background:#17202b;color:#fff;font-weight:700;font-size:13px;box-shadow:none}
#restartControls #btnRestartGame{background:#3a1720;border-color:#ff666655}
@media(min-width:800px){#controls{max-width:650px;margin:auto}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="top">
    <div class="badge">⭐ <span id="score">0</span></div>
    <div class="badge">🚩 Zona <span id="zone">1</span></div><div class="badge">😈 Dif. <span id="difficulty">1</span></div>
    <div class="badge">❤️ ∞</div>
  </div>
  <div id="msg"><b id="msgTitle"></b><div id="msgText"></div></div>
  <button id="shopBtn" type="button">👕 Tienda</button>
  <div id="controls">
    <div class="pad"><button id="left">◀</button><button id="right">▶</button></div>
    <div class="pad"><button id="turbo" aria-label="Turbo hacia adelante">⚡</button><button id="weapon" aria-label="Accionar arma">⚔️</button><button id="jump">⬆</button></div>
  </div>
  <div id="shop" aria-hidden="true">
    <div class="shopCard">
      <div class="shopHead"><h2>👕 Tienda de ropa</h2><button class="shopClose" id="shopClose">×</button></div>
      <div style="margin-bottom:12px">🪙 Monedas: <b id="shopCoins">0</b></div>
      <div class="skinGrid" id="skinGrid"></div>
      <div class="shopNote">Los precios son altos a propósito: juega, reúne monedas y desbloquea nuevos estilos. Las compras quedan guardadas.</div>
    </div>
  </div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize); resize();

const levels=[
 {name:"El comienzo", obstacles:["gap"], width:2050},
 {name:"Primer reto", obstacles:["spikes","moving"], width:2350},
 {name:"No te apresures", obstacles:["gap","disappear"], width:3000},
 {name:"Zona peligrosa", obstacles:["spikes","moving","gap"], width:3000},
 {name:"La combinación", obstacles:["moving","spikes","disappear","gap"], width:3400},
 {name:"Último tramo", obstacles:["gap","moving","spikes","spikes","disappear"], width:3800},
 {name:"META", obstacles:["gap","moving","spikes","disappear","gap","moving"], width:4200}
];

const player={x:100,y:0,w:30,h:38,vx:0,vy:0,onGround:false};
let level=0, worldX=0, checkpoint={x:100,y:0}, score=0, state="play", jumpLock=false, justRespawned=false, jumpCount=0;
let turboAvailable=false, turboCooldown=0, equippedSkin="classic", ownedSkins=["classic"];
const skins=[
 {id:"classic",name:"Explorador",cost:0,color:"#4266d6",accent:"#90a8ff"},
 {id:"neon",name:"Neón",cost:300,color:"#9b3cff",accent:"#35f0ff"},
 {id:"royal",name:"Comandante",cost:650,color:"#c68b24",accent:"#ffe18a"},
 {id:"shadow",name:"Sombra",cost:1100,color:"#20252f",accent:"#ff4e68"},
 {id:"cyber",name:"Cyber Elite",cost:1700,color:"#00a889",accent:"#a7fff0"}
];
const keys={left:false,right:false,jump:false};
const gravity=1750, speed=330, jump=-600;
let platforms=[], hazards=[], coins=[], goal={x:0,y:0};
let floatingObstacles=[];
let weaponSwing=0, weaponCooldown=0;
let particles=[];
let obstacleCount=0;
let activeEvents=[];
let eventCooldown=0;

function makeLevel(){
 const L=levels[level], floorY=H*.72;
 obstacleCount=0;
 platforms=[{x:0,y:floorY,w:430,h:40}];
 hazards=[];coins=[];floatingObstacles=[];activeEvents=[];weaponSwing=0;weaponCooldown=0;turboAvailable=false;turboCooldown=0;
 let x=430;
 const difficulty=level+1;
 const GAP=Math.min(215,172+difficulty*6); // más separación sin superar el alcance real
 const SUPPORT=Math.max(82,105-difficulty*3);
 const REST=Math.max(85,125-difficulty*5);

 function support(px,py,w=SUPPORT,eventKind=null){platforms.push({x:px,y:py,w:w,h:40,eventKind:eventKind,triggered:false})}
 function rest(px,py,w=REST){platforms.push({x:px,y:py,w:w,h:40})}
 function spikes(px,py,count=1){
   for(let n=0;n<count;n++) hazards.push({type:'spikes',x:px+n*28,y:py-24,w:26,h:24});
 }

 // Cada zona separa más los retos, pero coloca más peligros en la llegada.
 // La ruta sigue siendo físicamente alcanzable con el salto actual.
 const patterns = [
   ['gap'],
   ['gap','spikes'],
   ['gap','spikes','spikes'],
   ['gap','moving','spikes','gap'],
   ['moving','gap','spikes','spikes','disappear'],
   ['gap','moving','spikes','gap','spikes','disappear'],
   ['gap','spikes','moving','spikes','disappear','gap','spikes','moving']
 ];
 const pattern=patterns[Math.min(level,patterns.length-1)];
 // Cada zona tiene un "evento imposible" diferente. Siempre aparece con aviso
 // y deja una ventana de reacción, para que sea sorprendente pero físicamente evitable.
 // Varias trampas dinámicas por nivel. Todas tienen aviso y una ventana de reacción.
 const eventSets = [
   ['collapse','narrow'],
   ['shift','popspikes','collapse'],
   ['falling','blast','narrow'],
   ['collapse','saw','falling'],
   ['popspikes','narrow','blast','collapse'],
   ['shift','falling','saw','collapse'],
   ['collapse','giantsaw','ceiling','popspikes','narrow']
 ];
 const eventSet=eventSets[Math.min(level,eventSets.length-1)];
 let eventIndex=0;
 const eventFor=()=>{
   if(eventIndex>=eventSet.length) return null;
   return eventSet[eventIndex++];
 };

 pattern.forEach((type,i)=>{
   const base=floorY + ((i%3===1)?-35:0);
   obstacleCount++;

   if(type==='gap'){
     // Hueco desafiante pero dentro del vuelo máximo (~226 px).
     support(x,base,SUPPORT+8);
     const landingX=x+GAP;
     hazards.push({type:'gap',x:x+SUPPORT+8,w:GAP-(SUPPORT+8),y:base+5,h:90});
     // Obstáculos progresivos en la llegada: cuanto más avanzada la zona, más pinchos.
     support(landingX,base,SUPPORT+20,eventFor());
     spikes(landingX+SUPPORT-18,base,Math.min(4,1+Math.floor(level/1.8)));
     coins.push({x:landingX+40,y:base-62,r:9});
     x=landingX+SUPPORT+55;
   }

   if(type==='spikes'){
     support(x,base,SUPPORT+20);
     const count=Math.min(5,1+Math.floor(level/1.8));
     spikes(x+35,base,count);
     // Pequeño apoyo de salida: requiere saltar por encima de la cadena.
     const next=x+35+count*28+28;
     support(next,base,SUPPORT+10,eventFor());
     x=next+SUPPORT+35;
   }

   if(type==='moving'){
     support(x,base,SUPPORT+8);
     const mx=x+GAP-20;
     platforms.push({x:mx,y:base-35,w:100, h:40, move:true,startX:mx,range:35,phase:i});
     // Apoyo final más ancho para que el reto sea de precisión, no de suerte.
     support(mx+125,base,SUPPORT+18,eventFor());
     spikes(mx+70,base,level>=5?3:(level>=3?2:1));
     coins.push({x:mx+50,y:base-88,r:9});
     x=mx+SUPPORT+85;
   }

   if(type==='disappear'){
     support(x,base,SUPPORT+5);
     support(x+150,base-35,SUPPORT+5);
     spikes(x+150+SUPPORT-15,base-35,Math.min(2,1+Math.floor(level/3)));
     support(x+300,base,SUPPORT+15,eventFor());
     x=x+300+SUPPORT+65;
   }

   // Separación visual entre retos. No es una zona regalada: es el espacio necesario
   // para preparar el siguiente salto y evitar que dos obstáculos se mezclen accidentalmente.
   const restEvent=eventFor();
   if(restEvent) support(x,base,REST,restEvent);
   else rest(x,base,REST);
   x += 55 + difficulty*12;
 });

 // Nivel 2: sección especial con pasos tipo laberinto y obstáculos flotantes
 if(level===1){
   const mazeY=floorY-105;
   const mazeStart=x+40;
   const mazePattern=[
     {x:mazeStart,y:mazeY,w:125,h:32},
     {x:mazeStart+170,y:mazeY-70,w:105,h:32},
     {x:mazeStart+315,y:mazeY-18,w:120,h:32},
     {x:mazeStart+470,y:mazeY-88,w:100,h:32},
     {x:mazeStart+610,y:mazeY-35,w:135,h:32},
     {x:mazeStart+785,y:mazeY-100,w:105,h:32}
   ];
   mazePattern.forEach((m,i)=>{
     platforms.push({x:m.x,y:m.y,w:m.w,h:m.h,maze:true});
     if(i<mazePattern.length-1) coins.push({x:m.x+m.w*.5,y:m.y-38,r:8});
   });
   // Obstáculos flotantes cortables: no dañan si están lejos, pero bloquean el paso.
   const floatY=[floorY-190,floorY-285,floorY-155,floorY-250,floorY-180];
   for(let i=0;i<5;i++){
     floatingObstacles.push({x:mazeStart+95+i*165,y:floatY[i],w:42,h:42,alive:true,phase:i*.8,rot:0});
   }
   x=mazeStart+980;
   platforms.push({x:x-60,y:floorY,w:310,h:40});
 }

 goal.x=x+90;
 goal.y=floorY-90;
 platforms.push({x:x,y:floorY,w:260,h:40});
 player.x=100; player.y=floorY-player.h; player.vx=0; player.vy=0;
 checkpoint={x:100,y:floorY-player.h}; worldX=0;
 document.getElementById('zone').textContent=level+1; if(document.getElementById('difficulty')) document.getElementById('difficulty').textContent=Math.min(10, level+2);
 show('Zona '+(level+1),'Cada llegada tiene más obstáculos 😈');
 save();
}
function save(){localStorage.setItem("obstaculosSave",JSON.stringify({level,score,equippedSkin,ownedSkins}));}
function load(){try{let s=JSON.parse(localStorage.getItem("obstaculosSave"));if(s){level=Math.min(s.level||0,levels.length-1);score=s.score||0;equippedSkin=s.equippedSkin||"classic";ownedSkins=Array.isArray(s.ownedSkins)&&s.ownedSkins.length?s.ownedSkins:["classic"]}}catch(e){}}
load();makeLevel();

function respawn(){
 player.x=checkpoint.x;
 player.y=checkpoint.y-player.h;
 player.vx=0;
 player.vy=0;
 player.onGround=true;
 justRespawned=true;
 show("💥 ¡Cuidado!","Sin límite de vidas — vuelve a intentarlo");
}
function show(t,s){msgTitle.textContent=t;msgText.textContent=s;msg.style.display="block";setTimeout(()=>{if(state==="play")msg.style.display="none"},1200)}
function restart(){level=0;score=0;state="play";msg.style.display="none";makeLevel();save()}

function press(name,v){keys[name]=v}
for(const [id,k] of [["left","left"],["right","right"],["jump","jump"]]){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();press(k,true)});
 b.addEventListener("pointerup",e=>{e.preventDefault();press(k,false)});
 b.addEventListener("pointercancel",()=>press(k,false));
 b.addEventListener("pointerleave",()=>press(k,false));
}
const weaponBtn=document.getElementById("weapon");
const turboBtn=document.getElementById("turbo");
function useTurbo(){
 if(!turboAvailable || turboCooldown>0 || state!=="play") return;
 turboAvailable=false; turboCooldown=1.05;
 player.vx=Math.max(player.vx,520);
 player.x+=105;
 for(let n=0;n<12;n++) particles.push({x:player.x,y:player.y+player.h/2,vx:-80-Math.random()*150,vy:(Math.random()-.5)*90,life:.35});
 show("⚡ TURBO!","¡Impulso hacia adelante!");
}
turboBtn.addEventListener("pointerdown",e=>{e.preventDefault();useTurbo()});
function useWeapon(){
 if(level!==1 || weaponCooldown>0 || state!=="play") return;
 weaponSwing=0.24; weaponCooldown=0.38;
 const cx=player.x+player.w/2, cy=player.y+player.h/2;
 for(const o of floatingObstacles){
   if(!o.alive) continue;
   const dx=o.x+o.w/2-cx, dy=o.y+o.h/2-cy;
   if(Math.hypot(dx,dy)<115 && dx>-35){
     o.alive=false; score+=20;
     for(let n=0;n<10;n++) particles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.45});
   }
 }
}
weaponBtn.addEventListener("pointerdown",e=>{e.preventDefault();useWeapon()});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;if(e.key==="ArrowRight"||e.key==="d")keys.right=true;if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=true;if((e.key==="e"||e.key==="x"||e.key==="f"))useWeapon();if(state==="win"&&e.key==="r")restart()});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;if(e.key==="ArrowRight"||e.key==="d")keys.right=false;if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=false});
addEventListener("pointerdown",e=>{if(state==="win"){restart()}});

let last=performance.now();

function triggerEvent(p){
 if(!p.eventKind || p.triggered) return;
 p.triggered=true; eventCooldown=0.35;
 const x=p.x+p.w*0.55,y=p.y,k=p.eventKind;

 if(k==='collapse'){
   p.collapseDelay=0.42;p.collapseActive=true;p.collapseVy=35;
   show("⚠️ ¡EL APOYO FALLA!","Parecía seguro… ¡salta ahora!");
 }
 if(k==='narrow'){
   p.narrowDelay=0.32;p.narrowActive=true;p.originalW=p.w;
   show("😈 ¡SE ESTRECHA!","El punto de apoyo se está haciendo pequeño");
 }
 if(k==='shift'){
   p.shiftStart=p.x;p.shiftTarget=p.x+70+level*7;p.shiftTime=0;
   p.shiftSpeed=135+level*8;p.shiftActive=true;
   show("⚠️ ¡EL SUELO SE MUEVE!","La plataforma acaba de cambiar de lugar");
 }
 if(k==='falling'||k==='ceiling'){
   activeEvents.push({kind:k==='ceiling'?'ceiling':'rock',x:x+95,y:-90,
     vx:(level%2?-25:20),vy:45+level*6,r:k==='ceiling'?28:18,armed:true});
   show("☄️ ¡MIRA ARRIBA!","Algo acaba de caer del cielo");
 }
 if(k==='popspikes'){
   activeEvents.push({kind:'popspikes',x:x+28,y:y,w:Math.max(58,p.w-20),h:26,delay:0.48,active:false});
   show("⚠️ ¡TRAMPA!","Los pinchos van a aparecer");
 }
 if(k==='blast'){
   activeEvents.push({kind:'blast',x:x+55,y:y-18,r:0,maxR:54+level*5,delay:0.52,life:0.44,armed:false});
   show("💥 ¡REVIENTA!","Aléjate del punto marcado");
 }
 if(k==='wheel'){
   activeEvents.push({kind:'wheel',x:x+125,y:y-155,vx:-110-level*8,vy:0,r:24,spin:0,armed:true});
   show("🛞 ¡RUEDA!","Algo viene rodando desde arriba");
 }
 if(k==='saw'||k==='giantsaw'){
   activeEvents.push({kind:'saw',x:x+185,y:y-(k==='giantsaw'?48:95),
     vx:-105-level*9,vy:0,r:k==='giantsaw'?34:22,spin:0,
     armed:true,delay:k==='giantsaw'?0.35:0});
   show("⚙️ ¡DISCO!","El paso se cerrará: salta o busca el hueco");
 }
}
function eventHit(e){
 const px=player.x+player.w/2,py=player.y+player.h/2;
 if(e.kind==='popspikes'&&e.active)
   return player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y-e.h&&player.y<e.y;
 if(e.kind==='blast'&&e.armed) return Math.hypot(px-e.x,py-e.y)<e.r+14;
 if(e.kind==='rock'||e.kind==='wheel'||e.kind==='saw'){
   if(e.delay>0)return false;
   return Math.hypot(px-e.x,py-e.y)<e.r+17;
 }
 if(e.kind==='ceiling'&&e.armed)
   return player.x+player.w>e.x-e.r&&player.x<e.x+e.r&&player.y+player.h>e.y-e.r&&player.y<e.y+e.r;
 return false;
}
function updateEvents(dt){
 eventCooldown=Math.max(0,eventCooldown-dt);

 for(const p of platforms){
   if(p.collapseActive){
     p.collapseDelay-=dt;
     if(p.collapseDelay<=0){p.y+=p.collapseVy*dt;p.collapseVy+=950*dt;if(p.y>H+180)p.dead=true;}
   }
   if(p.narrowActive){
     p.narrowDelay-=dt;
     if(p.narrowDelay<=0){p.w=Math.max(58,p.w-145*dt);if(p.w<=58)p.narrowActive=false;}
   }
 }

 for(const e of activeEvents){
   if(e.kind==='popspikes'){
     e.delay-=dt;
     if(e.delay<=0) e.active=true;
   }
   if(e.kind==='blast'){
     e.delay-=dt;
     if(e.delay<=0){
       e.armed=true;
       e.r=Math.min(e.maxR,e.r+260*dt);
       e.life-=dt;
     }
   }
   if(e.kind==='rock'){
     e.vy+=1200*dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
   }
   if(e.kind==='wheel'){
     e.vy+=900*dt; e.x+=e.vx*dt; e.y+=e.vy*dt; e.spin+=dt*7;
   }
   if(e.kind==='saw'){
     e.delay=Math.max(0,(e.delay||0)-dt);e.x+=e.vx*dt;e.spin+=dt*10;
   }
   if(e.kind==='ceiling'){
     e.y+=e.vy*dt;e.vy+=1250*dt;if(e.y>H*.66)e.armed=false;
   }
 }
 activeEvents=activeEvents.filter(e=>{
   if(e.kind==='popspikes') return e.delay<1.5;
   if(e.kind==='blast') return e.delay>0 || e.life>0;
   return e.y<H+250 && e.x>-500 && e.x<goal.x+800;
 });
}

function update(dt,t){
 if(state!=="play")return;
 const floorY=H*.72;
 updateEvents(dt);
 platforms.forEach(p=>{
   p.prevX=p.x;
   if(p.move){p.x=p.startX+Math.sin(t/850+p.phase)*p.range}
   if(p.vanish){p.t=Math.max(0,p.t-dt); if(p.t===0 && Math.random()<dt*.25)p.t=1.5}
   if(p.shiftActive){
     const dir=Math.sign(p.shiftTarget-p.x);
     p.x += dir*p.shiftSpeed*dt;
     if((dir>0&&p.x>=p.shiftTarget)||(dir<0&&p.x<=p.shiftTarget)){p.x=p.shiftTarget;p.shiftActive=false;}
   }
 });
 for(const p of platforms){
   if(!p.dead && p.shiftActive && player.onGround && player.x+player.w>p.x && player.x<p.x+p.w){
     player.x += (p.x-(p.prevX||p.x));
   }
 }
 let dir=(keys.right?1:0)-(keys.left?1:0);
 player.vx += (dir*speed-player.vx)*Math.min(1,dt*8);
 if(Math.abs(player.vx)<2)player.vx=0;
 if(keys.jump && !jumpLock){
   if(player.onGround){
     player.vy=jump;
     player.onGround=false;
     jumpCount=1;
     turboAvailable=true;
     jumpLock=true;
   }else if(jumpCount===1){
     player.vy=jump;
     jumpCount=2;
     jumpLock=true;
   }
}
 if(!keys.jump)jumpLock=false;
 turboCooldown=Math.max(0,turboCooldown-dt);
 if(!player.onGround && jumpCount>0 && turboCooldown<=0) turboAvailable=true;
 player.vy+=gravity*dt;
 let oldY=player.y;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.onGround=false;
 for(const p of platforms){
   if(p.dead)continue;
   if(p.vanish && p.t<=0)continue;
   if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+8&&player.y+player.h>=p.y&&player.vy>=0){
     player.y=p.y-player.h;player.vy=0;player.onGround=true;jumpCount=0;
     if(p.eventKind && !p.triggered && eventCooldown<=0) triggerEvent(p);
     if(!p.eventKind && !p.move && p.x >= checkpoint.x + 220){checkpoint={x:p.x+18,y:p.y}; score+=5}
   }
 }
 // Obstáculos flotantes del nivel 2: se mueven como puertas del laberinto y se cortan con el arma.
 for(const o of floatingObstacles){
   if(!o.alive) continue;
   o.y += Math.sin(t/500+o.phase)*0.35;
   o.rot += dt*1.7;
   if(player.x+player.w>o.x&&player.x<o.x+o.w&&player.y+player.h>o.y&&player.y<o.y+o.h){
     respawn(); break;
   }
 }
 for(const h of hazards){
   if(h.type==="spikes"&&player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h){respawn(); break;}
 }
 if(!justRespawned){
   for(const e of activeEvents){
     if(eventHit(e)){ respawn(); break; }
   }
 }
 if(!justRespawned && player.y>H+150)respawn();
 if(justRespawned){
   justRespawned=false;
   worldX=Math.max(0,player.x-W*.35);
   return;
 }
 for(const coin of coins){if(!coin.got&&Math.hypot(player.x+16-coin.x,player.y+20-coin.y)<28){coin.got=true;score+=10}}
 if(player.x>goal.x){
   if(level<levels.length-1){level++;score+=100;show("¡Zona superada!","La siguiente cadena de obstáculos será más difícil 😈");makeLevel()}
   else{state="win";show("🏆 ¡META!","Has superado todas las zonas");save()}
 }
 worldX=Math.max(0,player.x-W*.35);
}
function draw(t){
 const floorY=H*.72;
 ctx.clearRect(0,0,W,H);
 // sky
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#121c35");g.addColorStop(1,"#25314b");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant grid
 ctx.strokeStyle="#ffffff0d";ctx.lineWidth=1;
 for(let x=(-worldX%60);x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=H*.18;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.save();ctx.translate(-worldX,0);
 // background lights
 for(let x=Math.floor(worldX/300)*300;x<worldX+W+300;x+=300){ctx.fillStyle="#ffffff08";ctx.fillRect(x,100,2,450)}
 // platforms
 for(const p of platforms){
   if(p.dead)continue;
   if(p.vanish&&p.t<=0)continue;
   ctx.fillStyle=p.vanish?"#6e8cff":p.move?"#55d6b0":"#53627f";
   ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.fillStyle="#ffffff30";ctx.fillRect(p.x,p.y,p.w,5);
 }
 // señales de las trampas dinámicas: el reto sorprende, pero no depende de azar ciego.
 for(const p of platforms){
   if(p.dead)continue;
   if(p.collapseActive){ctx.strokeStyle="#ffb347";ctx.lineWidth=2;ctx.strokeRect(p.x,p.y-7,p.w,4);}
   if(p.narrowActive){ctx.strokeStyle="#c58cff";ctx.lineWidth=2;ctx.strokeRect(p.x,p.y-7,p.w,4);}
 }
 // hazards
 for(const h of hazards)if(h.type==="spikes"){
   ctx.fillStyle="#ff4e68";
   for(let x=h.x;x<h.x+h.w;x+=18){ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+9,h.y);ctx.lineTo(x+18,h.y+h.h);ctx.fill()}
 }
 // surprise events
 for(const e of activeEvents){
   if(e.kind==='popspikes'){
     ctx.fillStyle=e.active?"#ff4e68":"#ffb347";
     const yy=e.y-(e.active?e.h:3);
     for(let x=e.x;x<e.x+e.w;x+=18){
       ctx.beginPath();ctx.moveTo(x,yy+e.h);ctx.lineTo(x+9,yy);ctx.lineTo(x+18,yy+e.h);ctx.fill();
     }
   }
   if(e.kind==='blast'){
     if(e.delay>0){
       ctx.strokeStyle="#ffd45a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,18,0,Math.PI*2);ctx.stroke();
     }else{
       ctx.strokeStyle="#ff704d";ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
     }
   }
   if(e.kind==='rock'){
     ctx.fillStyle="#7c6757";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
     ctx.fillStyle="#b69b82";ctx.beginPath();ctx.arc(e.x-6,e.y-6,5,0,Math.PI*2);ctx.fill();
   }
   if(e.kind==='ceiling'){
     ctx.fillStyle="#5e6576";ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*1.45);
     ctx.fillStyle="#9299aa";ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,5);
   }
   if(e.kind==='wheel'){
     ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.spin);ctx.strokeStyle="#aeb7c9";ctx.lineWidth=7;
     ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.stroke();
     ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-e.r,0);ctx.lineTo(e.r,0);ctx.moveTo(0,-e.r);ctx.lineTo(0,e.r);ctx.stroke();ctx.restore();
   }
   if(e.kind==='saw'){
     ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.spin);ctx.fillStyle="#d7dbe5";
     ctx.beginPath();
     for(let a=0;a<Math.PI*2;a+=Math.PI/8){
       const rr=(Math.floor(a/(Math.PI/4))%2===0)?e.r:e.r-7;
       ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
     }
     ctx.closePath();ctx.fill();ctx.fillStyle="#555d70";ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore();
   }
 }
 // obstáculos flotantes cortables del nivel 2
 for(const o of floatingObstacles){
   if(!o.alive) continue;
   ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.rot);
   ctx.fillStyle="#8f5d45";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
   ctx.strokeStyle="#ffd27a";ctx.lineWidth=3;ctx.strokeRect(-o.w/2+3,-o.h/2+3,o.w-6,o.h-6);
   ctx.strokeStyle="#fff5";ctx.beginPath();ctx.moveTo(-12,-12);ctx.lineTo(12,12);ctx.moveTo(12,-12);ctx.lineTo(-12,12);ctx.stroke();ctx.restore();
 }
 // arma / golpe del jugador
 if(level===1 && weaponSwing>0){
   ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);
   ctx.rotate(-0.9 + (0.24-weaponSwing)/0.24*1.8);
   ctx.strokeStyle="#ffe29a";ctx.lineWidth=6;ctx.lineCap="round";
   ctx.beginPath();ctx.moveTo(8,2);ctx.lineTo(82,-20);ctx.stroke();
   ctx.strokeStyle="#d7e4ff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(12,1);ctx.lineTo(78,-19);ctx.stroke();
   ctx.restore();
 }
 // coins
 for(const q of coins)if(!q.got){ctx.fillStyle="#ffd45a";ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff4";ctx.beginPath();ctx.arc(q.x-3,q.y-3,3,0,Math.PI*2);ctx.fill()}
 // goal
 ctx.fillStyle="#e9eefb";ctx.fillRect(goal.x,goal.y,5,90);ctx.fillStyle="#2ee88a";ctx.beginPath();ctx.moveTo(goal.x+5,goal.y);ctx.lineTo(goal.x+65,goal.y+20);ctx.lineTo(goal.x+5,goal.y+40);ctx.fill();
 // Avatar mejorado + ropa/skin equipada.
 const skin=skins.find(s=>s.id===equippedSkin)||skins[0];
 const walking = Math.abs(player.vx) > 25 && player.onGround;
 const step = walking ? (Math.sin(t/85) > 0 ? 1 : -1) : 0;
 const px=Math.round(player.x), py=Math.round(player.y);
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle="#0006"; ctx.fillRect(px+3,py+player.h+3,25,5);
 // mochila
 ctx.fillStyle="#202b46";ctx.fillRect(px+4,py+15,7,16);
 // piernas y botas
 ctx.fillStyle="#202941";ctx.fillRect(px+9,py+28,6,11);ctx.fillRect(px+18,py+28,6,11);
 ctx.fillStyle="#9bb0d7";
 if(step>0){ctx.fillRect(px+5,py+37,11,5);ctx.fillRect(px+19,py+36,10,5);}
 else if(step<0){ctx.fillRect(px+9,py+36,10,5);ctx.fillRect(px+17,py+37,11,5);}
 else {ctx.fillRect(px+6,py+39,10,4);ctx.fillRect(px+18,py+39,10,4);}
 // torso / chaqueta
 ctx.fillStyle=skin.color;ctx.fillRect(px+7,py+13,18,17);
 ctx.fillStyle=skin.accent;ctx.fillRect(px+10,py+15,12,12);
 ctx.fillStyle="#e7efff";ctx.fillRect(px+15,py+16,2,10);
 // brazos articulados
 ctx.fillStyle="#f2c7a5";ctx.fillRect(px+3,py+16+(step>0?2:step<0?-2:0),4,12);ctx.fillRect(px+25,py+16+(step<0?2:step>0?-2:0),4,12);
 // cuello y cabeza
 ctx.fillStyle="#f2c7a5";ctx.fillRect(px+13,py+9,7,6);ctx.fillRect(px+8,py+2,16,13);
 // cabello
 ctx.fillStyle="#182038";ctx.fillRect(px+7,py+1,18,6);ctx.fillRect(px+7,py+5,4,8);ctx.fillRect(px+21,py+5,4,5);
 // visor/ojos
 ctx.fillStyle="#7fe7ff";ctx.fillRect(px+17,py+7,4,3);ctx.fillRect(px+12,py+7,3,2);
 // detalle de hombro
 ctx.fillStyle=skin.accent;ctx.fillRect(px+23,py+14,3,5);
 ctx.restore();
 // prompt
 if(state==="win"){
   ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);
   ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="800 30px system-ui";
   ctx.fillText("🏆 META COMPLETADA",W/2,H*.42);
   ctx.font="600 17px system-ui";ctx.fillText("Toca la pantalla para volver a jugar",W/2,H*.50);
 }
 document.getElementById("score").textContent=score;
 }
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt,now);draw(now);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
<div id="restartControls">
  <button id="btnRestartLevel" type="button">🔄 Reiniciar nivel</button>
  <button id="btnRestartGame" type="button">🏠 Reiniciar juego</button>
</div>
<script>
const shop=document.getElementById("shop"),shopGrid=document.getElementById("skinGrid"),shopCoins=document.getElementById("shopCoins");
function renderShop(){
 shopCoins.textContent=score;
 shopGrid.innerHTML=skins.map(sk=>{
   const owned=ownedSkins.includes(sk.id), equipped=equippedSkin===sk.id;
   const label=equipped?"Equipada":owned?"Usar":`Comprar · ${sk.cost} 🪙`;
   return `<div class="skin"><div class="skinPreview"><div class="miniAvatar"><div class="head"></div><div class="body" style="--skin:${sk.color}"></div><div class="legs"></div></div></div><b>${sk.name}</b><small>${sk.cost===0?"Gratis":"Precio: "+sk.cost+" monedas"}</small><button data-skin="${sk.id}" ${equipped?"disabled":""}>${label}</button></div>`;
 }).join("");
 shopGrid.querySelectorAll("button[data-skin]").forEach(btn=>btn.addEventListener("click",()=>{
   const sk=skins.find(x=>x.id===btn.dataset.skin); if(!sk)return;
   if(!ownedSkins.includes(sk.id)){
     if(score<sk.cost){show("🪙 Te faltan monedas","Juega un poco más para comprar esta ropa");return;}
     score-=sk.cost; ownedSkins.push(sk.id);
   }
   equippedSkin=sk.id; save(); renderShop(); show("👕 ¡Nuevo estilo!",sk.name+" equipado");
 }));
}
document.getElementById("shopBtn").addEventListener("click",()=>{renderShop();shop.classList.add("open");shop.setAttribute("aria-hidden","false")});
document.getElementById("shopClose").addEventListener("click",()=>{shop.classList.remove("open");shop.setAttribute("aria-hidden","true")});
shop.addEventListener("pointerdown",e=>{if(e.target===shop){shop.classList.remove("open");shop.setAttribute("aria-hidden","true")}});
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
function restartCurrentLevel(){
  state="play"; msg.style.display="none"; keys.left=keys.right=keys.jump=false; jumpLock=false; justRespawned=false; turboAvailable=false; turboCooldown=0;
  makeLevel();
  show("🔄 Nivel reiniciado", "Vuelves al inicio de esta zona");
}
function restartWholeGame(){
  level=0; score=0; state="play"; msg.style.display="none"; keys.left=keys.right=keys.jump=false; jumpLock=false; justRespawned=false; turboAvailable=false; turboCooldown=0;
  makeLevel(); save();
  show("🏠 Juego reiniciado", "Has vuelto a la Zona 1");
}
document.getElementById("btnRestartLevel").addEventListener("click",restartCurrentLevel);
document.getElementById("btnRestartGame").addEventListener("click",restartWholeGame);
function updateWeaponButton(){
  weaponBtn.classList.toggle("active",level===1);
  turboBtn.classList.toggle("active",turboAvailable && turboCooldown<=0 && state==="play");
  document.getElementById("shopCoins").textContent=score;
}
// El botón se actualiza al cambiar de zona.
updateWeaponButton();
setInterval(updateWeaponButton,120);
</script>
</body>
